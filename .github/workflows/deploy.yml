
name: ShopLite CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoplite-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            repository: shoplite/frontend

          - service: catalog
            context: ./catalog-service
            repository: shoplite/catalog

          - service: inventory
            context: ./inventory-service
            repository: shoplite/inventory

          - service: orders
            context: ./order-service
            repository: shoplite/orders

    env:
      AWS_ACCOUNT_ID: "836505524477"
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=cd-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=cd-${{ matrix.service }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    environment:
      name: production

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        run: |
          test -n "$VM_HOST" || { echo "VM_HOST is missing"; exit 1; }
          test -n "$VM_USER" || { echo "VM_USER is missing"; exit 1; }
          test -n "$APP_DOMAIN" || { echo "APP_DOMAIN variable is missing"; exit 1; }

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add EC2 host to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "sudo mkdir -p /opt/shoplite/db && sudo chown -R $VM_USER:$VM_USER /opt/shoplite"

      - name: Copy deployment files to EC2
        run: |
          scp scripts/deploy.sh \
            "$VM_USER@$VM_HOST:/tmp/shoplite-deploy.sh"

          scp db/init.sql \
            "$VM_USER@$VM_HOST:/tmp/shoplite-init.sql"

          ssh "$VM_USER@$VM_HOST" \
            "sudo install -m 755 /tmp/shoplite-deploy.sh /opt/shoplite/deploy.sh && sudo install -m 644 /tmp/shoplite-init.sql /opt/shoplite/db/init.sql && sudo chown $VM_USER:$VM_USER /opt/shoplite/deploy.sh /opt/shoplite/db/init.sql && rm -f /tmp/shoplite-deploy.sh /tmp/shoplite-init.sql"

      - name: Deploy application
        run: |
          echo "Deploying commit: $GITHUB_SHA"

          ssh "$VM_USER@$VM_HOST" \
            "IMAGE_TAG=$GITHUB_SHA /opt/shoplite/deploy.sh"

      - name: Verify application health
        run: |
          curl --fail --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://$APP_DOMAIN/api/catalog/health"

          echo "ShopLite deployment successful."
