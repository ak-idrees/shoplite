
name: ShopLite CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint ${{ matrix.service }} Dockerfile
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: frontend/Dockerfile
          - service: catalog
            dockerfile: catalog-service/Dockerfile
          - service: inventory
            dockerfile: inventory-service/Dockerfile
          - service: orders
            dockerfile: order-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: hadolint

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: shoplite/frontend

          - service: catalog
            context: ./catalog-service
            image: shoplite/catalog

          - service: inventory
            context: ./inventory-service
            image: shoplite/inventory

          - service: orders
            context: ./order-service
            image: shoplite/orders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Check image size
        run: |
          SIZE=$(docker image inspect \
            "${{ matrix.image }}:ci" \
            --format='{{.Size}}')

          LIMIT=$((300 * 1024 * 1024))

          echo "Image: ${{ matrix.service }}"
          echo "Image size: $((SIZE / 1024 / 1024)) MiB"
          echo "Maximum allowed: 300 MiB"

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ERROR: Image exceeds the 300 MiB limit."
            exit 1
          fi

          echo "Image size check passed."
