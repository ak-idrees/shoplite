
server {
    listen 80;
    server_name  shoplite-idrees.duckdns.org ;
server {
    listen 443 ssl;
    server_name shoplite-idrees.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/shoplite-idrees.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoplite-idrees.duckdns/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/catalog/ {
        proxy_pass http://catalog:3000/;
    }

    location /api/inventory/ {
        proxy_pass http://inventory:8081/;
    }

    location /api/orders/ {
        proxy_pass http://orders:8082/;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
